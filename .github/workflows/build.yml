name: Build RyukSign IPA

on:
  push:
    paths-ignore:
      - '**.md'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a GitHub Release with the built IPA'
        type: boolean
        default: false
      release_tag:
        description: 'Custom release tag (optional, defaults to v<Version>-<short-sha>)'
        type: string
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify Xcode and build tools
        run: |
          echo "Available Xcode installations:"
          ls -d /Applications/Xcode*.app || true
          xcode-select -p
          xcodebuild -version
          if ! command -v jq >/dev/null 2>&1; then
            brew install jq
          fi

      - name: Fetch SSL dependencies and compile IPA
        run: |
          agvtool new-version -all "$(git rev-parse HEAD)"
          make
          ls -lh packages/

      - name: Extract app version and metadata
        id: meta
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" Payload/*.app/Info.plist)
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "SHORT_SHA=${SHORT_SHA}" >> "$GITHUB_ENV"

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            RELEASE_TAG="${GITHUB_REF_NAME}"
          elif [[ -n "${{ inputs.release_tag }}" ]]; then
            RELEASE_TAG="${{ inputs.release_tag }}"
          else
            RELEASE_TAG="v${VERSION}-${SHORT_SHA}"
          fi
          echo "RELEASE_TAG=${RELEASE_TAG}" >> "$GITHUB_ENV"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RyukSign-${{ env.VERSION }}-${{ env.SHORT_SHA }}
          path: packages/*.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.create_release == true
        uses: softprops/action-gh-release@v2
        with:
          name: RyukSign ${{ env.RELEASE_TAG }}
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            packages/*.ipa
          generate_release_notes: true
          fail_on_unmatched_files: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
